name: CI/CD Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da imagem
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/observability:latest \
            .

      - name: Push para Docker Hub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/observability:latest
      
      - name: Puxa a Imagem
        run: |
          docker pull \
            ${{ secrets.DOCKERHUB_USERNAME }}/observability:latest
             .

      - name: Subir e Execultar o novo Container
        run: |
          docker compose up -d \
            ${{ secrets.DOCKERHUB_USERNAME }}/observability:latest
             .
      - name: Limpar Imagem Antiga
        run: |
          docker image prune -f \
            ${{ secrets.DOCKERHUB_USERNAME }}/observability:latest